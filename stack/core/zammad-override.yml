# Joins the Zammad nginx frontend to the shared "demo" network so Caddy can
# reverse-proxy tickets.<domain> to it.
networks:
  demo:
    external: true

services:
  zammad-nginx:
    networks:
      default:
      demo:
    # Caddy terminates TLS, so this inner nginx sees plain http and would
    # forward X-Forwarded-Proto=http; Rails then fails the SAML kickoff with
    # InvalidAuthenticityToken (origin https vs base_url http). Pin the
    # forwarded scheme to https (entrypoint rewrites the proxy headers).
    environment:
      - NGINX_SERVER_SCHEME=https
